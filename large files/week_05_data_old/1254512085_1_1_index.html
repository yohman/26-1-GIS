<div id="title">
<h1>🌊 日本の綺麗な海マップ</h1>
<p>クリックして海の魅力を見つけよう</p>
</div>

<div id="map"></div>

<script>

const map = new maplibregl.Map({
container: 'map',
style: 'https://tile.openstreetmap.jp/styles/osm-bright/style.json',
center: [138,36],
zoom: 4.5
});

map.addControl(new maplibregl.NavigationControl());

const spots = [
{
name:"与那覇前浜ビーチ",
coords:[125.27,24.73],
desc:"東洋一美しいとも呼ばれるビーチ",
season:"おすすめ：夏"
},
{
name:"川平湾",
coords:[124.14,24.45],
desc:"透明度抜群の絶景スポット",
season:"おすすめ：春〜夏"
},
{
name:"白良浜",
coords:[135.34,33.68],
desc:"白い砂浜が美しい海岸",
season:"おすすめ：夏"
},
{
name:"浄土ヶ浜",
coords:[141.98,39.65],
desc:"白い岩と青い海のコントラスト",
season:"おすすめ：夏"
},
{
name:"積丹岬",
coords:[140.47,43.33],
desc:"積丹ブルーで有名",
season:"おすすめ：夏"
}
];

spots.forEach(spot => {

new maplibregl.Marker({color:"#00bfff"})
.setLngLat(spot.coords)
.setPopup(
new maplibregl.Popup().setHTML(`
<h3>${spot.name}</h3>
<p>${spot.desc}</p>
<p>${spot.season}</p>
`)
)
.addTo(map);

});

</script>
