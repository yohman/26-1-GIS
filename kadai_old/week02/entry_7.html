        <div class="description">
            RESASの宿泊者分析マップは、観光客の宿泊状況を都道府県ごとに色分けして分かりやすく可視化しており、地域ごとの違いや特徴を直感的に把握できる点が良いと感じた。また、年度変更やヒートマップ表示など操作も簡単で使いやすく、自分のWebマップ制作でも、色やデータの見せ方を工夫して情報を分かりやすく伝えることの大切さを学ぶ参考になった。
