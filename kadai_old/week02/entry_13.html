            目的：その時代にどの国が統治していたかが一目でわかる<br>良いと思う点：スライドで年を変えれて人のアイコンをクリックすればその当時の国のリーダーなどが詳しく見れるウィキペディアに飛べるから詳しく歴史を知ることができる。<br>気づいたこと：色分けされていて見やすい、年代を変えたあとすぐ反映されるから待ち時間が少ない。<br>自分のプロジェクトでの参考点：ウィキペディアなどとつなげることで情報を詳しく知らせることができるところを参考にしたい。
