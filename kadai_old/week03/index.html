<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .home-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        
        .home-button a {
            background: #000;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .home-button a:hover {
            background: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #000;
            font-size: 1.5rem;
            font-weight: normal;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 40px;
            font-weight: normal;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1px;
            background: #ddd;
            border: 1px solid #ddd;
        }
        
        .gallery-item {
            background: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .gallery-item:hover {
            background: #e8e8e8;
        }
        
        .gallery-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }
        
        .gallery-item .info {
            padding: 8px;
            background: white;
            border-top: 1px solid #ddd;
        }
        
        .gallery-item .student-id {
            font-size: 0.7rem;
            color: #000;
            font-weight: normal;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.2rem;
            }
            
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            
            .gallery-item img {
                height: 120px;
            }
        }
    </style>
</head>
