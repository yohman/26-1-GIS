<div id="title">
🌙 夜行きたいマップ

<div id="subtitle">
自分の推し場所マップ
</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>

<script>

const map = new maplibregl.Map({
	container: 'map',

	style: 'https://tile.openstreetmap.jp/styles/maptiler-basic-ja/style.json',

	center: [139.95, 35.85],

	zoom: 12
});

map.addControl(new maplibregl.NavigationControl());

const locations = [

{
	lng: 139.9719,
	lat: 35.8623,
	name: "柏駅",
	text: `
	ブレイクダンスのコミュニティがある<br><br>

	<img src="1254510534_1_3_dance.jpg" width="220">
	`
},

{

	lng: 139.941666,
	lat: 35.840519,
	name: "壱角屋",
	text: `
	中毒性がすごいので部活後には高確率で行きます<br><br>
	<img src="1254510534_1_4_ikkakuya.jpg" width="220">
	`

}
];

locations.forEach(loc => {

	const popup = new maplibregl.Popup({
		offset: 25
	}).setHTML(
		`
		<h2>${loc.name}</h2>
		<p>${loc.text}</p>
		`
	);

	new maplibregl.Marker({
		color: "#d26bff"
	})
	.setLngLat([loc.lng, loc.lat])
	.setPopup(popup)
	.addTo(map);

});

</script>
