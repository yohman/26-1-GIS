<!DOCTYPE html>
<html>

<head>
	<!-- 文字エンコーディングをUTF-8に設定（日本語などの文字化けを防ぐ） -->
	<meta charset="utf-8">

	<!-- ブラウザのタブに表示されるページタイトル -->
	<title>My First Web Map</title>

	<!-- MapLibre GLのスタイルシート（地図の見た目を定義） -->
	<link href="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.css" rel="stylesheet">

	<!-- 独自のスタイルシート（地図のサイズなどをカスタマイズ） -->
	<link rel="stylesheet" href="1254511524_1_2_style.css">
</head>

<body>
<div style="position:fixed;top:20px;right:20px;z-index:9999;">
    <div style="background:#000;color:#fff;padding:10px 20px;margin-bottom:5px;font-family:'Courier New',monospace;font-size:11px;text-align:center;">
        <div style="font-size:10px;color:#999;margin-bottom:3px;">1254511524</div>
        <div style="font-size:12px;margin-bottom:3px;">平山　琴愛</div>
        <div style="font-size:10px;color:#ccc;">2026/05/26 09:40</div><div style="font-size:10px;margin-top:5px;"><a href="https://padlet.com/tsasao/26-1-reitaku-gis-acbkafzbx0kp4mu0/wish/MxrmZYBnJOLNWGOq" target="_blank" style="color:#4CAF50;text-decoration:none;">→ PADLET POST</a></div>
    </div>
    <div style="display:flex;gap:5px;"><a href="1254510865_1_1_index.html" style="background:#000;color:#fff;padding:10px 20px;text-decoration:none;font-family:'Courier New',monospace;font-size:12px;">PREV</a><a href="../index.html" style="background:#000;color:#fff;padding:10px 20px;text-decoration:none;font-family:'Courier New',monospace;font-size:12px;">HOME</a><a href="1254511912_1_1_index.html" style="background:#000;color:#fff;padding:10px 20px;text-decoration:none;font-family:'Courier New',monospace;font-size:12px;">NEXT</a></div></div>


	<!-- 地図を表示するための空のコンテナ（id="map"で識別） -->
	<div id="map"></div>

	<!-- MapLibre GLのJavaScriptライブラリを読み込む -->
	<script src="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>

	<script>
		// ===== 地図の初期化 =====
		// 新しい地図オブジェクトを作成
		const map = new maplibregl.Map({
			container: 'map',  // 地図を表示する要素のID
			style: 'https://demotiles.maplibre.org/style.json',  // 地図のデザイン（背景地図）
			center: [139.7671, 35.6812],  // 初期表示の中心座標 [経度, 緯度]（東京駅）
			zoom: 8  // 初期ズームレベル（数字が大きいほど拡大）
		});

		// ===== ナビゲーションコントロールの追加 =====
		// 地図の右上にズームボタンと回転ボタンを追加
		map.addControl(new maplibregl.NavigationControl());

		// ===== マーカーの追加 =====
		// 地図上にピンを立てる
		new maplibregl.Marker()
			
	      .setLngLat([139.5250, 35.3758])  // マーカーの位置 [経度, 緯度]（東京駅）
			.setPopup(
				
				// マーカーをクリックしたときに表示されるポップアップ
				new maplibregl.Popup()
					.setHTML("<h3>Tokyo Disney Land</h3><p>Welcome to Tokyo Disney Resort!</p>")  // ポップアップの内容（HTML形式）
			)
			.addTo(map);  // 作成したマーカーを地図に追加


			const locations = [
			{ lng: 139.5304, lat: 35.3734, name: "Tokyo Disney Sea" },
			{ lng: 139.5250, lat: 35.3758, name: "Tokyo Disney Land" },	
			{ lng: 139.763769, lat: 35.676628, name: "東京国際フォーラム" },
			{ lng: 139.645883, lat: 35.745548, name: "ハリーポッタースタジオツアー" }
			];



			locations.forEach(loc => {
			new maplibregl.Marker()
				.setLngLat([loc.lng, loc.lat])
				.setPopup(
				new maplibregl.Popup().setHTML(`<h3>${loc.name}</h3>`)
				)
				.addTo(map);
			});







	</script>

</body>

</html>
