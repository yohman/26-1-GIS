<!DOCTYPE html>
<html>

<head>
	<!-- 文字エンコーディングをUTF-8に設定（日本語などの文字化けを防ぐ） -->
	<meta charset="utf-8">

	<!-- ブラウザのタブに表示されるページタイトル -->
	<title>My First Web Map</title>

	<!-- MapLibre GLのスタイルシート（地図の見た目を定義） -->
	<link href="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.css" rel="stylesheet">

	<!-- 独自のスタイルシート（地図のサイズなどをカスタマイズ） -->
	<link rel="stylesheet" href="1254810372_1_2_style.css">
</head>

<body>
<div style="position:fixed;top:20px;right:20px;z-index:9999;">
    <div style="background:#000;color:#fff;padding:10px 20px;margin-bottom:5px;font-family:'Courier New',monospace;font-size:11px;text-align:center;">
        <div style="font-size:10px;color:#999;margin-bottom:3px;">1254810372</div>
        <div style="font-size:12px;margin-bottom:3px;">佐藤　陸</div>
        <div style="font-size:10px;color:#ccc;">2026/05/22 09:13</div><div style="font-size:10px;margin-top:5px;"><a href="https://padlet.com/tsasao/26-1-reitaku-gis-acbkafzbx0kp4mu0/wish/9kmlZVpJmNRnapgV" target="_blank" style="color:#4CAF50;text-decoration:none;">→ PADLET POST</a></div>
    </div>
    <div style="display:flex;gap:5px;"><a href="1254810182_1_1_index.html" style="background:#000;color:#fff;padding:10px 20px;text-decoration:none;font-family:'Courier New',monospace;font-size:12px;">PREV</a><a href="../index.html" style="background:#000;color:#fff;padding:10px 20px;text-decoration:none;font-family:'Courier New',monospace;font-size:12px;">HOME</a><a href="1254810405_1_1_index.html" style="background:#000;color:#fff;padding:10px 20px;text-decoration:none;font-family:'Courier New',monospace;font-size:12px;">NEXT</a></div></div>


	<!-- 地図を表示するための空のコンテナ（id="map"で識別） -->
	<div id="map"></div>

	<!-- MapLibre GLのJavaScriptライブラリを読み込む -->
	<script src="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>

	<script>
		// ===== 地図の初期化 =====
		// 新しい地図オブジェクトを作成
		const map = new maplibregl.Map({
			container: 'map',  // 地図を表示する要素のID
			style: 'https://tiles.openfreemap.org/styles/liberty',  // 地図のデザイン（背景地図）
			center: [139.95483, 35.833506],  // 初期表示の中心座標 [経度, 緯度]（東京駅）
			zoom: 14  // 初期ズームレベル（数字が大きいほど拡大）
		});
        const locations = [
            { lng: 139.95649158931127, lat: 35.8363937973848, name: "南柏 旬の鮮魚と四季の地酒 すしの磯一" },
            { lng: 139.95598186340845, lat: 35.83850818699136, name: "タージマハル" },
            { lng: 139.95585979273486, lat: 35.849061868262105, name: "資さんうどん 南柏店" },
            { lng: 139.95601378561128, lat: 35.83122279718067, name: "モスバーガー麗澤大学前店" },
        ];

        locations.forEach(loc => {
            new maplibregl.Marker()
                .setLngLat([loc.lng, loc.lat])
                .setPopup(
                new maplibregl.Popup().setHTML(`<h3>${loc.name}</h3>`)
                )
                .addTo(map);
        });


		// ===== ナビゲーションコントロールの追加 =====
		// 地図の右上にズームボタンと回転ボタンを追加
		map.addControl(new maplibregl.NavigationControl());

		// ===== マーカーの追加 =====
		// 地図上にピンを立てる
		new maplibregl.Marker({ color: "red" })
			.setLngLat([139.95483, 35.833506])  // マーカーの位置 [経度, 緯度]（東京駅）
			.setPopup(
				// マーカーをクリックしたときに表示されるポップアップ
				new maplibregl.Popup()
					.setHTML("<h3>Reitaku Univercity</h3><p>Hello MapLibre!</p>")  // ポップアップの内容（HTML形式）
			)
			.addTo(map);  // 作成したマーカーを地図に追加

	</script>

</body>

</html>
