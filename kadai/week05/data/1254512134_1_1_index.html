<body>

        <div style="font-size:10px;color:#ccc;">2026/06/01 12:20</div>
    </div>
    <div style="display:flex;gap:5px;"><a href="1254512085_1_1_index.html" style="background:#000;color:#fff;padding:10px 20px;text-decoration:none;font-family:'Courier New',monospace;font-size:12px;">PREV</a><a href="../index.html" style="background:#000;color:#fff;padding:10px 20px;text-decoration:none;font-family:'Courier New',monospace;font-size:12px;">HOME</a><a href="1254690352_1_1_index.html" style="background:#000;color:#fff;padding:10px 20px;text-decoration:none;font-family:'Courier New',monospace;font-size:12px;">NEXT</a></div></div>



    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([35.8610, 139.9680], 14);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // 柏市の境界線と市外マスク（Overpass の応答を堅牢に処理）
        fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(`[out:json];relation["name"="柏市"]["admin_level"="7"];out geom;`))
            .then(res => res.json()).then(data => {
                if (!data || !Array.isArray(data.elements) || data.elements.length === 0) return;
                const cityCoords = [];

                // relation 要素内の members に geometry が含まれる形式を優先して扱う
                const rel = data.elements.find(e => e.type === 'relation') || data.elements[0];
                if (rel && Array.isArray(rel.members)) {
                    rel.members.forEach(m => {
                        if (m.geometry && Array.isArray(m.geometry)) cityCoords.push(m.geometry.map(g => [g.lat, g.lon]));
                    });
                }

                // フォールバック: elements 自体が複数の way を返す場合
                if (cityCoords.length === 0) {
                    data.elements.forEach(e => {
                        if (e.type === 'way' && Array.isArray(e.geometry)) cityCoords.push(e.geometry.map(g => [g.lat, g.lon]));
                    });
                }

                if (cityCoords.length === 0) return;

                // 外側（世界）マスクと内側（市境界）を渡すことで穴あきポリゴンにする
                const worldMask = [[90, -180], [90, 180], [-90, 180], [-90, -180], [90, -180]];
                L.polygon([worldMask, ...cityCoords], {color: 'none', fillColor: '#ffffff', fillOpacity: 0.6, interactive: false, fillRule: 'evenodd'}).addTo(map);

                // 境界線は各リングごとに描画
                cityCoords.forEach(ring => L.polyline(ring, {color: '#ff4444', weight: 3, opacity: 0.7}).addTo(map));
            }).catch(err => console.warn('Overpass fetch error:', err));

        const createIcon = (color, symbol) => L.divIcon({
            html: `<svg width="28" height="38" viewBox="0 0 24 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0C7.58 0 4 4.48 4 10C4 17.5 12 28 12 28C12 28 20 17.5 20 10C20 4.48 16.42 0 12 0Z" fill="${color}"/>
                    <circle cx="12" cy="10" r="4" fill="white"/>
                    <text x="12" y="13" font-size="8" text-anchor="middle" fill="${color}" font-weight="bold">${symbol}</text>
                   </svg>`,
            className: 'post-icon',
            iconSize: [28, 38],
            iconAnchor: [14, 38],
            popupAnchor: [0, -34]
        });

        // 資料[1][2][3][4]から抽出した網羅データ
        const postData = [
            // --- 証明写真機 (Photo) ---
            { name: "柏駅東口・丸井柏店 2F出口付近", type: "photo", lat: 35.861955, lng: 139.971500, info: "デッキ直結階に設置" },
            { name: "柏駅西口・柏髙島屋ステーションモール", type: "photo", lat: 35.862150, lng: 139.969800, info: "S館付近・屋内設置" },
            { name: "柏駅構内（中央改札外）", type: "photo", lat: 35.862300, lng: 139.970800, info: "JR改札を出て右側" },
            { name: "柏郵便局内", type: "photo", lat: 35.859700, lng: 139.976000, info: "ロビー付近に設置" },
            { name: "イトーヨーカドー柏店 1F入口", type: "photo", lat: 35.860500, lng: 139.972500, info: "屋外・駐輪場付近" },
            // --- 柏駅周辺エリア ---
            { name: "柏駅東口ダブルデッキ", type: "std", lat: 35.862441, lng: 139.971432, info: "差出箱13号" },
            { name: "柏駅東口・丸井柏店", type: "std", lat: 35.861985, lng: 139.971556, info: "差出箱12号" },

            { name: "柏駅西口パーキング", type: "std", lat: 35.863112, lng: 139.967882, info: "立体駐車場出口" },
            { name: "TNコーポレーション", type: "std", lat: 35.859115, lng: 139.967554, info: "オフィスビル歩道" },

            // --- コンビニ店内(屋内)ポスト ---
            { name: "ローソンストア100柏千代田", type: "con", lat: 35.857991, lng: 139.975112, info: "店内設置" },
            { name: "ローソン柏7丁目店内", type: "con", lat: 35.864125, lng: 139.978580, info: "店内レジ付近" },

            // --- 豊四季台・郊外エリア ---
            { name: "豊四季台2団地105号棟", type: "std", lat: 35.867221, lng: 139.957112, info: "団地生活道路" },

            { name: "柏中新宿郵便局", type: "po", lat: 35.8368, lng: 139.9632, info: "中新宿住宅街" },
            { name: "イオンモール柏内", type: "po", lat: 35.8521, lng: 139.9615, info: "商業施設内ATM" },

            // --- 特殊デザイン(レイソル・ゴールド) ---
            { name: "柏郵便局前(ゴールド)", type: "gold", lat: 35.859752, lng: 139.976054, info: "記念ゴールドポスト" },
            { name: "柏市役所(レイソル)", type: "reysol", lat: 35.865121, lng: 139.976512, info: "レイソルラッピング" },
            { name: "柏駅東口(レイソル)", type: "reysol", lat: 35.862455, lng: 139.971445, info: "デッキ上ラッピング" },
            { name: "柏の葉PO(レイソル)", type: "reysol", lat: 35.893812, lng: 139.954224, info: "スマートシティ地区" }
        ];

        const icons = {
            std: createIcon('#EA4335', '〒'),
            con: createIcon('#34A853', '〒'),
            po: createIcon('#1A73E8', 'JP'),
            reysol: createIcon('#FFD700', 'R'),
            gold: createIcon('#DAA520', 'G'),
            rare: createIcon('#704214', '!'),
            photo: createIcon('#8E44AD', 'P')
        };

        // 駅周辺＋証明写真機の追加データ
        postData.push(
            { name: "柏駅東口デッキ(レイソル)", type: "reysol", lat: 35.862455, lng: 139.971445, info: "デッキ上ラッピング" },
            { name: "柏市役所本庁舎(レイソル)", type: "reysol", lat: 35.865121, lng: 139.976512, info: "市制記念ラッピング" },
            { name: "柏第三小学校前(レイソル)", type: "reysol", lat: 35.856912, lng: 139.978432, info: "通学路のシンボル" },
            { name: "柏の葉キャンパスPO(レイソル)", type: "reysol", lat: 35.893812, lng: 139.954224, info: "スマートシティ地区" },
            { name: "南柏駅前郵便局", type: "po", lat: 35.8447, lng: 139.9538, info: "南柏エリア拠点" },
            { name: "JR柏駅 中央改札内", type: "photo", lat: 35.862300, lng: 139.970800, info: "Photo-Me / 始発～終電" },
            { name: "柏マルイ 2Fデッキ直結口", type: "photo", lat: 35.861955, lng: 139.971500, info: "Ki-Re-i / 10:30-20:00" },
            { name: "ドン・キホーテ 柏駅前店", type: "photo", lat: 35.861800, lng: 139.972200, info: "1Fロッカー横屋内" },
            { name: "ファミマ 柏駅西口店外", type: "photo", lat: 35.862400, lng: 139.968500, info: "屋外24時間" }
        );

        postData.forEach(p => {
            L.marker([p.lat, p.lng], {icon: icons[p.type]}).addTo(map)
                .bindPopup(`<b>${p.name}</b><br>${p.info}<br><small>座標: ${p.lat}, ${p.lng}</small>`);
        });

        const legend = L.control({position: 'bottomright'});
        legend.onAdd = () => {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = '<b>凡例</b><br>' +
                '<i style="background: #8E44AD"></i> 証明写真機 (Photo)<br>' +
                '<i style="background: #EA4335"></i> 街頭ポスト<br>' +
                '<i style="background: #34A853"></i> コンビニ店内<br>' +
                '<i style="background: #1A73E8"></i> 郵便局/ATM拠点<br>' +
                '<i style="background: #FFD700"></i> レイソルポスト<br>' +
                '<i style="background: #DAA520"></i> ゴールドポスト<br>' +
                '<i style="background: #704214"></i> 希少旧式ポスト';
            return div;
        };
        legend.addTo(map);
    </script>
