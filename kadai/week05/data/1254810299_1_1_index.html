// ============================================================
// Map & Markers
// ============================================================
const map = L.map('map', {
  center: [36.5, 137.5],
  zoom: 6,
  zoomControl: true,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

function makeIcon(type) {
  const color = type === 'style' ? '#1a5fa8' : '#c8102e';
  const label = type === 'style' ? 'AS' : 'A';
  return L.divIcon({
    className: '',
    html: `<div style="width:26px;height:26px;background:${color};border:2.5px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,0.28);display:flex;align-items:center;justify-content:center">
      <span style="transform:rotate(45deg);color:#fff;font-size:8px;font-weight:900;font-family:sans-serif;line-height:1">${label}</span>
    </div>`,
    iconSize: [26, 26],
    iconAnchor: [13, 26],
    popupAnchor: [0, -28],
  });
}

const markers = [];
const markerLayer = L.layerGroup().addTo(map);

function getPhotoUrl(store) {
  // Google Maps Street View Static API (no key needed for static embed URL trick via place photo)
  // We use Nominatim + osm doesn't provide photos; use a placeholder approach via Google search link
  const q = encodeURIComponent(store.name + ' ' + store.pref);
  return `https://maps.googleapis.com/maps/api/streetview?size=260x130&location=${store.lat},${store.lng}&key=`;
}

function buildPopup(store) {
  const typeLabel = store.type === 'style' ? 'AEON STYLE' : 'AEON';
  const mapsUrl = `https://maps.google.com/maps?q=${store.lat},${store.lng}`;
  return `<div class="popup-inner">
    <div class="popup-type">${typeLabel}</div>
    <div class="popup-name">${store.name}</div>
    <div class="popup-meta">
      <span>${store.pref}</span>
      <span>${store.city}</span>
    </div>
    <a href="${mapsUrl}" target="_blank" style="display:inline-block;padding:5px 14px;background:var(--red);color:#fff;border-radius:14px;font-size:12px;text-decoration:none;font-weight:700;">Google Mapで見る</a>
  </div>`;
}

STORES.forEach(store => {
  const marker = L.marker([store.lat, store.lng], { icon: makeIcon(store.type) });
  marker.bindPopup(buildPopup(store), { maxWidth: 280, minWidth: 240 });
  marker.storeData = store;
  markers.push(marker);
  markerLayer.addLayer(marker);
});

function updateCount(visible) {
  document.getElementById('countBadge').textContent = `${visible} 件表示`;
}
updateCount(markers.length);

// ============================================================
// Filter by area
// ============================================================
let currentArea = 'all';
let currentSearch = '';

function applyFilters() {
  markerLayer.clearLayers();
  let count = 0;
  markers.forEach(m => {
    const s = m.storeData;
    const areaMatch = currentArea === 'all' || s.area === currentArea;
    const searchMatch = !currentSearch || s.name.includes(currentSearch) || s.pref.includes(currentSearch) || s.city.includes(currentSearch);
    if (areaMatch && searchMatch) {
      markerLayer.addLayer(m);
      count++;
    }
  });
  updateCount(count);
}

document.querySelectorAll('.area-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.area-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentArea = btn.dataset.area;
    applyFilters();
    // Zoom to area
    const areaBounds = {
      '北海道': [[41.3, 139.3], [45.6, 145.9]],
      '東北': [[36.8, 139.0], [41.6, 142.0]],
      '関東': [[34.8, 138.8], [36.9, 140.9]],
      '中部': [[34.5, 136.0], [38.2, 140.0]],
      '近畿': [[33.7, 134.3], [35.5, 136.4]],
      '中国': [[33.9, 131.5], [35.6, 134.5]],
      '四国': [[33.4, 132.2], [34.4, 134.5]],
      '九州': [[26.0, 127.6], [33.9, 131.7]],
    };
    if (currentArea === 'all') {
      map.setView([36.5, 137.5], 6);
    } else if (areaBounds[currentArea]) {
      map.fitBounds(areaBounds[currentArea], { padding: [20, 20] });
    }
  });
});

// ============================================================
// Search
// ============================================================
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  currentSearch = q;
  if (!q) {
    searchResults.style.display = 'none';
    applyFilters();
    return;
  }
  applyFilters();
  const hits = markers.filter(m => {
    const s = m.storeData;
    return s.name.includes(q) || s.pref.includes(q) || s.city.includes(q);
  }).slice(0, 10);
  if (hits.length === 0) {
    searchResults.style.display = 'none';
    return;
  }
  searchResults.innerHTML = hits.map(m => {
    const s = m.storeData;
    return `<div class="result-item" data-idx="${markers.indexOf(m)}">
      <div class="result-name">${s.name}</div>
      <div class="result-addr">${s.pref} ${s.city}</div>
      <div class="result-area">${s.area}</div>
    </div>`;
  }).join('');
  searchResults.style.display = 'block';
});

searchResults.addEventListener('click', e => {
  const item = e.target.closest('.result-item');
  if (!item) return;
  const idx = parseInt(item.dataset.idx);
  const m = markers[idx];
  searchResults.style.display = 'none';
  map.setView([m.storeData.lat, m.storeData.lng], 15);
  m.openPopup();
});

document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput) {
    searchResults.style.display = 'none';
  }
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    searchResults.style.display = 'none';
    currentSearch = '';
    searchInput.value = '';
    applyFilters();
  }
});
</script>
