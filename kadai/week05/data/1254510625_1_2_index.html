	<header>
		<h1>麗澤大学周辺ラーメンマップ</h1>
		<p>左の一覧から店舗をクリックして地図を探索。地図が3D表示で立体的に見えます。マーカーをクリックすると店舗情報を表示します。</p>
	</header>

	<div class="container">
		<aside id="sidebar">
			<section>
				<h2>店舗一覧</h2>
				<p style="font-size:12px;color:#666;margin:0 0 8px 0;">↓ 索引をクリックして筛りこんで</p>
				<div id="index-tabs" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;"></div>
				<div class="search-row">
					<input type="search" id="search" placeholder="店舗名で検索">
				</div>
				<div class="search-row" style="margin-top:6px">
					<label><input type="checkbox" id="nationwide"> 全国検索</label>
					<label><input type="checkbox" id="google-search"> Google検索</label>
				</div>
				<div id="search-status" aria-live="polite" style="font-size:12px;color:#666;margin-top:6px"></div>
				<div class="list-controls">
					<select id="sort">
						<option value="relevance">関連順</option>
						<option value="distance">距離順</option>
						<option value="rating">評価順</option>
					</select>
					<button id="export-csv">CSV出力</button>
				</div>
				<div class="data-controls">
					<button id="load-data" type="button">ローカルJSON読み込み</button>
					<button id="save-results" type="button">検索結果を保存</button>
					<input type="file" id="data-file" accept="application/json,.json,text/csv,.csv">
				</div>
				<ul id="shop-list"></ul>
			</section>
			<section>
				<h2>データソース</h2>
				<ul>
					<li><a href="https://www.openstreetmap.org/" target="_blank">OpenStreetMap</a></li>
					<li><a href="https://maplibre.org/maplibre-gl-js/docs/" target="_blank">MapLibre GL JS</a></li>
					<li><a href="https://maps.gsi.go.jp/" target="_blank">地理院地図</a></li>
				</ul>
			</section>
		</aside>

		<main id="main">
		<div class="main-tabs">
			<button class="main-tab-btn active" data-tab="map">🗺 地図</button>
			<button class="main-tab-btn" data-tab="list">📋 一覧</button>
		</div>
		
		<div id="map-tab" class="main-tab-content active" data-tab="map">
			<div id="region-label">位置情報を表示</div>
			<div class="map-style-controls">
				<label for="map-style">表示モード:</label>
				<select id="map-style">
					<option value="osm">標準地図</option>
					<option value="satellite">衛星写真</option>
				</select>
			</div>
			<div id="map"></div>
		</div>
		
		<div id="list-tab" class="main-tab-content" data-tab="list">
			<div class="list-view-controls">
				<input type="search" id="list-search" placeholder="店舗名・住所で検索..." style="flex:1;">
				<select id="list-sort">
					<option value="order">並び順</option>
					<option value="name">名前順</option>
					<option value="prefecture">都道府県順</option>
				</select>
				<button id="list-export" class="export-btn">CSV出力</button>
			</div>
			<div id="list-count" style="padding:10px;font-size:12px;color:#666;"></div>
			<div id="shop-list-view"></div>
		</div>
	</div>

	<footer>
		<p>参考: OpenStreetMap / MapLibre / 国土地理院</p>
	</footer>

	<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
	<script src="1254510625_1_4_main.js"></script>
</body>
</html>
