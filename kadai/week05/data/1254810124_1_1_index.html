<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>全国有名水族館マップ（23施設・動画なし版）</title>
    <link href="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        /* 左側のコントロールパネル */
        .control-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
            width: 220px;
        }

        .control-panel button {
            display: block;
            margin: 4px 0;
            padding: 6px 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            text-align: left;
            font-size: 11px;
        }

        .control-panel button:hover {
            background-color: #0056b3;
        }

        .control-panel button.btn-reset {
            background-color: #28a745;
            text-align: center;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .control-panel button.btn-reset:hover {
            background-color: #218838;
        }

        /* 確実に消せる詳細パネル（モーダル）のスタイル */
        .detail-modal {
            display: none; /* 初期状態は非表示 */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100; /* 最前面に配置 */
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            width: 280px; /* 動画がないので少しスリムに */
        }

        /* パネルを閉じる「×」ボタン */
        .modal-close-btn {
            position: absolute;
            top: 10px;
            right: 14px;
            font-size: 22px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
        }
        .modal-close-btn:hover {
            color: #333;
        }
    </style>
</head>

<body>
<div style="position:fixed;top:20px;right:20px;z-index:9999;">
    <div style="background:#000;color:#fff;padding:10px 20px;margin-bottom:5px;font-family:'Courier New',monospace;font-size:11px;text-align:center;">
        <div style="font-size:10px;color:#999;margin-bottom:3px;">1254810124</div>
        <div style="font-size:12px;margin-bottom:3px;">江口　歩真<br><span style='font-size:9px;color:#999;'>エグチ　アユマ</span></div>
        <div style="font-size:10px;color:#ccc;">2026/06/01 14:25</div><div style="font-size:10px;margin-top:5px;"><a href="https://padlet.com/tsasao/26-1-reitaku-gis-acbkafzbx0kp4mu0/wish/Xb8YaLpvLKwwayn1" target="_blank" style="color:#4CAF50;text-decoration:none;">→ PADLET POST</a></div>

    <div style="display:flex;gap:5px;"><a href="1254810075_1_2_index.html" style="background:#000;color:#fff;padding:10px 20px;text-decoration:none;font-family:'Courier New',monospace;font-size:12px;">PREV</a><a href="../index.html" style="background:#000;color:#fff;padding:10px 20px;text-decoration:none;font-family:'Courier New',monospace;font-size:12px;">HOME</a><a href="1254810174_1_4_第五回GIS課題_鬼塚駿.html" style="background:#000;color:#fff;padding:10px 20px;text-decoration:none;font-family:'Courier New',monospace;font-size:12px;">NEXT</a></div></div>






    <div class="control-panel">
        <div style="font-size: 13px; margin-bottom: 8px; color: #111; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 4px;">全国の水族館</div>
        <button id="btn-japan" class="btn-reset">日本全体を表示</button>
        <div id="button-container"></div>
    </div>

    <div id="map"></div>

    <div id="info-modal" class="detail-modal">
        <button class="modal-close-btn" onclick="closeModal()">&times;</button>
        <div id="modal-pref" style="font-size: 11px; font-weight: bold; color: #666; margin-bottom: 2px;"></div>
        <h3 id="modal-name" style="margin: 2px 0 8px 0; color: #006699; font-size: 17px;"></h3>
        <p id="modal-desc" style="margin: 0; font-size: 13px; color: #333; line-height: 1.5;"></p>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>

    <script>
        // ==========================================
        // 1. 地図の初期化
        // ==========================================
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty', 
            center: [137.0, 37.5], 
            zoom: 5
        });

        map.addControl(new maplibregl.NavigationControl());
        map.addControl(new maplibregl.ScaleControl({ maxWidth: 80, unit: 'metric' }));


        // ==========================================
        // 2. 水族館データ（全23施設）※座標修正済・動画URL削除済
        // ==========================================
        const aquariums = [
            { name: "浅虫水族館", pref: "青森県", lnglat: [140.8598, 40.8927], desc: "本州最北端の水族館。青森県の豊かな水産資源の展示や、迫力あるイルカパフォーマンスが人気です。" },
            { name: "男鹿水族館GAO", pref: "秋田県", lnglat: [139.7049, 39.9482], desc: "男鹿の海を再現した大水槽や、人気もののホッキョクグマ「豪太」くんに会える水族館です。" },
            { name: "仙台うみの杜水族館", pref: "宮城県", lnglat: [140.9822, 38.2725], desc: "豊かな三陸の海を再現した大水槽や、東北最大級のスタジアムで行われるイルカ・アシカのショーが見どころ。" },
            { name: "アクアマリンふくしま", pref: "福島県", lnglat: [140.9037, 36.9416], desc: "「潮目の海」をテーマに、親潮と黒潮が交わる福島沖の海を巨大な三角トンネル水槽で美しく表現しています。" },
            { name: "鴨川シーワールド", pref: "千葉県", lnglat: [140.1192, 35.1158], desc: "太平洋をバックに行われる、海の王者「シャチ」の圧倒的な大迫力ショーが有名！" },
            { name: "サンシャイン水族館", pref: "東京都", lnglat: [139.7200, 35.7289], desc: "池袋のビル屋上にある「天空のオアシス」。頭上を泳ぐアシカやペンギンが都会的。" },
            { name: "葛西臨海水族園", pref: "東京都", lnglat: [139.8618, 35.6417], desc: "大きなガラスドームが目印。大水槽を群泳するクロマグロの迫力に圧倒されます。" },
            { name: "すみだ水族館", pref: "東京都", lnglat: [139.8107, 35.7101], desc: "東京スカイツリータウン内。国内最大級の屋内開放型プールでペンギンを間近に観察。" },
            { name: "マクセル アクアパーク品川", pref: "東京都", lnglat: [139.7356, 35.6277], desc: "音・光・映像のデジタル演出と生き物が融合した、圧倒的な美しさを誇る最先端の都市型水族館です。" },
            { name: "新江ノ島水族館", pref: "神奈川県", lnglat: [139.4807, 35.3093], desc: "相模湾を再現した大水槽や、富士山と江の島をバックに見るイルカショーが最高です。" },
            { name: "横浜・八景島シーパラダイス", pref: "神奈川県", lnglat: [139.6455, 35.3366], desc: "日本最大級の水族館を含む4つのアクアミュージアムと、アトラクションが融合した島。" },
            { name: "名古屋港水族館", pref: "愛知県", lnglat: [136.8782, 35.0906], desc: "日本最大のプールを誇り、大迫力のシャチやイルカのパフォーマンスが楽しめます。" },
            { name: "鳥羽水族館", pref: "三重県", lnglat: [136.8450, 34.4819], desc: "飼育種類数が日本一（約1,200種）！日本で唯一ジュゴンに会える水族館です。" },
            { name: "京都水族館", pref: "京都府", lnglat: [135.7431, 34.9863], desc: "日本初の完全人工海水を利用した内陸型水族館。国の特別天然記念物オオサンショウウオが名物。" },
            { name: "海遊館", pref: "大阪府", lnglat: [135.4290, 34.6545], desc: "世界最大級の水族館。巨大な「太平洋」水槽で泳ぐジンベエザメは圧巻のスケールです。" },
            { name: "宮島水族館", pref: "広島県", lnglat: [132.3151, 34.2965], desc: "世界遺産・宮島にある水族館。瀬戸内海の生き物を中心に、カキいかだの再現やスナメリが人気です。" },
            { name: "しまね海洋館アクアス", pref: "島根県", lnglat: [132.0232, 34.9407], desc: "シロイルカ（ベルーガ）たちが作り出す空気の泡「幸せのバブルリング」パフォーマンスが全国的に有名。" },
            { name: "四国水族館", pref: "香川県", lnglat: [133.8213, 34.3121], desc: "2020年オープンの次世代水族館。「四国の水景」をテーマに、瀬戸内海を一望できるイルカプールは絶景。" },
            { name: "桂浜水族館", pref: "高知県", lnglat: [133.5746, 33.4965], desc: "名勝・桂浜にあるアットホームな水族館。個性豊かな生き物や、ユニークなSNS発信が話題です。" },
            { name: "マリンワールド海の中道", pref: "福岡県", lnglat: [130.3643, 33.6625], desc: "「九州の海」をテーマに、大迫力のイルカショーや巨大なサメ（シロワニ）が泳ぐ大水槽が楽しめます。" },
            { name: "水族館うみたまご", pref: "大分県", lnglat: [131.5348, 33.2662], desc: "動物たちとの距離が驚くほど近い水族館。セイウチのコントのようなショーや、イルカと触れ合えるビーチが人気。" },
            { name: "かごしま水族館", pref: "鹿児島県", lnglat: [130.5630, 31.5960], desc: "目の前に桜島を望む水族館。世界最大の魚類・ジンベエザメが悠々と泳ぐ「黒潮大水槽」は圧巻です。" },
            { name: "沖縄美ら海水族館", pref: "沖縄県", lnglat: [127.8779, 26.6944], desc: "沖縄の海を丸ごと体感。黒潮の海を再現した巨大アクリルパネル水槽に感動します。" }
        ];


        // ==========================================
        // 3. マーカーとボタンの自動生成・イベント設定
        // ==========================================
        const buttonContainer = document.getElementById('button-container');

        aquariums.forEach(aqua => {
            // --- ① 地図上にマーカーを設置 ---
            const el = document.createElement('img');
            el.src = 'https://img.icons8.com/color/48/aquarium.png'; 
            el.style.width = '42px';
            el.style.height = '42px';
            el.style.cursor = 'pointer';
            el.onerror = () => { el.src = 'https://img.icons8.com/color/48/marker.png'; };

            // マーカーをクリックしたときに詳細パネルを開く
            el.addEventListener('click', () => {
                showModal(aqua);
                map.flyTo({ center: aqua.lnglat, zoom: 12, speed: 1.0 });
            });

            new maplibregl.Marker({ element: el })
                .setLngLat(aqua.lnglat)
                .addTo(map);

            // --- ② 左パネルにジャンプボタンを追加 ---
            const btn = document.createElement('button');
            btn.innerHTML = `<span style="color: #a5d8ff; font-size: 10px; margin-right: 4px;">[${aqua.pref}]</span> ${aqua.name}`;
            
            btn.addEventListener('click', () => {
                showModal(aqua);
                map.flyTo({
                    center: aqua.lnglat,
                    zoom: 12,
                    speed: 1.2,
                    curve: 1.4
                });
            });
            buttonContainer.appendChild(btn);
        });

        // --- ③ 日本全体に戻るボタンの処理 ---
        document.getElementById('btn-japan').addEventListener('click', () => {
            closeModal(); // 全体表示のときは詳細を閉じる
            map.flyTo({
                center: [137.0, 37.5],
                zoom: 5,
                speed: 1.2
            });
        });

        // ==========================================
        // 4. 浮き出るパネル（モーダル）の制御関数
        // ==========================================
        const modal = document.getElementById('info-modal');
        const mPref = document.getElementById('modal-pref');
        const mName = document.getElementById('modal-name');
        const mDesc = document.getElementById('modal-desc');

        // パネルを開いてデータをセットする
        function showModal(aqua) {
            mPref.innerText = aqua.pref;
            mName.innerText = aqua.name;
            mDesc.innerText = aqua.desc;
            modal.style.display = 'block'; // パネルを表示
        }

        // パネルを閉じる
        function closeModal() {
            modal.style.display = 'none'; // パネルを非表示
        }

    </script>

</body>

</html>
